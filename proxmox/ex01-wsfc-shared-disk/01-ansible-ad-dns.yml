- name: Install AD and DNS features
  hosts: all
  gather_facts: false
  tasks:

    - name: Block to setup AD features
      tags: ad_setup
      block:
        - name: Install Active Directory Domain Services and DNS
          ansible.windows.win_feature:
            name:
              - AD-Domain-Services
              - DNS
            include_management_tools: yes
            state: present
          register: ad_install

        - name: Reboot if AD DS install requires it
          ansible.windows.win_reboot:
          when: ad_install.reboot_required

        - name: Check if server is already a Domain Controller
          ansible.windows.win_powershell:
            script: |
              $role = (Get-CimInstance Win32_ComputerSystem).DomainRole
              if ($role -ge 4) {
                Write-Output "DC"
              } else {
                Write-Output "NOT_DC"
              }
          register: dc_status
          changed_when: false

        - name: Promote server to Domain Controller (only if not already)
          ansible.windows.win_powershell:
            script: |
              Import-Module ADDSDeployment

              $secpass = ConvertTo-SecureString "SuperSecurePassword123!" -AsPlainText -Force

              Install-ADDSForest `
                -DomainName "prod.davidedigio.net" `
                -DomainNetbiosName "DAVIDEDIGIO" `
                -SafeModeAdministratorPassword $secpass `
                -InstallDns `
                -Force:$true
          when:
            - dc_status is defined
            - dc_status.output is defined
            - "'NOT_DC' in dc_status.output | trim"
          register: dc_promo

        - name: Reboot after domain controller promotion
          ansible.windows.win_reboot:
          when: dc_promo is defined and dc_promo.changed

    # -------------------------------------------------------------------------
    # Groups, Users, Assignments
    # -------------------------------------------------------------------------

    - name: Ensure AD groups exist
      microsoft.ad.group:
        name: "{{ item.name }}"
        scope: global
        category: security
        state: present
      loop:
        - { name: "admin" }
        - { name: "rdpaccessor" }
        - { name: "basicuser" }

    - name: Ensure AD users exist
      microsoft.ad.user:
        name: "{{ item.name }}"
        sam_account_name: "{{ item.name }}"
        upn: "{{ item.name }}@prod.davidedigio.net"
        password: "{{ item.password }}"
        state: present
        enabled: true
        password_never_expires: true
      loop:
        - { name: "alice", password: "Demolab001!" }
        - { name: "bob", password: "Demolab001!" }
        - { name: "chris", password: "Demolab001!" }

    - name: Assign users to groups
      microsoft.ad.group:
        name: "{{ item.group }}"
        members:
          add:
            - "{{ item.user }}"
      loop:
        - { user: "alice", group: "admin" }
        - { user: "alice", group: "rdpaccessor" }
        - { user: "bob", group: "rdpaccessor" }
        - { user: "chris", group: "basicuser" }

    # -------------------------------------------------------------------------
    # Disable built-in Administrator (by SID to avoid locale issues)
    # -------------------------------------------------------------------------

    - name: Disable built-in Administrator account
      microsoft.ad.user:
        identity: "S-1-5-21-*-500"   # relative SID pattern not supported; use win_powershell below
        enabled: false
        state: present
      # NOTE: microsoft.ad.user does not support SID wildcards.
      # Use the task below instead and remove this one.
      # Kept here as a placeholder to show intent; the win_powershell task is authoritative.
      when: false

    - name: Disable built-in Administrator via SID lookup
      ansible.windows.win_powershell:
        script: |
          $admin = Get-LocalUser | Where-Object { $_.SID -like "S-1-5-21-*-500" }
          if ($admin -and $admin.Enabled) {
            Disable-LocalUser -SID $admin.SID
            Write-Output "DISABLED"
          } else {
            Write-Output "ALREADY_DISABLED"
          }
      register: admin_disable
      changed_when: "'DISABLED' in admin_disable.output"

    # -------------------------------------------------------------------------
    # RDP restriction: only rdpaccessor members can log on via RDP
    # Enforced via GPO linked to the domain. Applies to all domain-joined machines.
    # -------------------------------------------------------------------------

    - name: Create GPO for RDP access restriction
      ansible.windows.win_powershell:
        script: |
          Import-Module GroupPolicy

          $gpoName = "RDP Access Control"
          $domainName = "prod.davidedigio.net"

          if (-not (Get-GPO -Name $gpoName -ErrorAction SilentlyContinue)) {
            New-GPO -Name $gpoName -Domain $domainName | Out-Null
            Write-Output "CREATED"
          } else {
            Write-Output "EXISTS"
          }
      register: gpo_create
      changed_when: "'CREATED' in gpo_create.output"

    - name: Set Allow log on through Remote Desktop Services in GPO
      ansible.windows.win_powershell:
        script: |
          Import-Module GroupPolicy

          $gpoName   = "RDP Access Control"
          $domainName = "prod.davidedigio.net"
          $section   = "User Rights"

          # SeDenyRemoteInteractiveLogonRight is the deny side; use SeRemoteInteractiveLogonRight for allow.
          # Setting the allow list to only rdpaccessor implicitly denies everyone else.
          Set-GPRegistryValue `
            -Name $gpoName `
            -Key "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -ValueName "fDenyTSConnections" `
            -Type DWord `
            -Value 0 | Out-Null

          # Privilege rights cannot be set via Set-GPRegistryValue; use secedit-based approach via inf.
          # Build a Security Template inf and import it into the GPO.
          $infContent = @"
          [Unicode]
          Unicode=yes
          [Version]
          signature="`$CHICAGO`$"
          Revision=1
          [Privilege Rights]
          SeRemoteInteractiveLogonRight = *S-1-5-32-544,DAVIDEDIGIO\rdpaccessor
          "@

          $infPath = "$env:TEMP\rdp_restriction.inf"
          $infContent | Out-File -FilePath $infPath -Encoding Unicode

          $gpo = Get-GPO -Name $gpoName
          $gpoId = $gpo.Id.ToString()
          $sysvolPath = "\\$domainName\SYSVOL\$domainName\Policies\{$gpoId}\Machine\Microsoft\Windows NT\SecEdit"

          if (-not (Test-Path $sysvolPath)) {
            New-Item -ItemType Directory -Path $sysvolPath -Force | Out-Null
          }

          Copy-Item $infPath "$sysvolPath\GptTmpl.inf" -Force

          # Update GPO version to force clients to pick it up
          $gptIniPath = "\\$domainName\SYSVOL\$domainName\Policies\{$gpoId}\GPT.INI"
          $gptIni = Get-Content $gptIniPath
          $gptIni = $gptIni -replace 'Version=(\d+)', { "Version=$([int]$matches[1] + 1)" }
          $gptIni | Set-Content $gptIniPath

          Write-Output "CONFIGURED"
      changed_when: "'CONFIGURED' in gpo_rdp.output"
      register: gpo_rdp

    - name: Link GPO to domain root
      ansible.windows.win_powershell:
        script: |
          Import-Module GroupPolicy

          $gpoName    = "RDP Access Control"
          $domainName = "prod.davidedigio.net"
          $domainDN   = "DC=prod,DC=davidedigio,DC=net"

          $existingLinks = (Get-GPInheritance -Target $domainDN).GpoLinks | Where-Object { $_.DisplayName -eq $gpoName }

          if (-not $existingLinks) {
            New-GPLink -Name $gpoName -Target $domainDN -LinkEnabled Yes | Out-Null
            Write-Output "LINKED"
          } else {
            Write-Output "ALREADY_LINKED"
          }
      register: gpo_link
      changed_when: "'LINKED' in gpo_link.output"